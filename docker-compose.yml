# =============================================================================
# Docker Compose - Synapse'26
# Development and Production configurations
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Development Service
  # ---------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env.local
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Production Service
  # ---------------------------------------------------------------------------
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env.production
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # CI Service (for GitHub Actions)
  # ---------------------------------------------------------------------------
  ci:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    command: sh -c "npm run lint && npm run build"
